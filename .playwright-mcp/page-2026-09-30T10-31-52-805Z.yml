                      - text: Rooms start at $550 including breakfast
                    - strong [ref=f3e2273]: "Closest transport:"
                    - text: 42 St-Bryant Park subway station, for the B, D, F and M trains, is two blocks away, and you’re a 10-minute walk from Grand Central Station. LaGuardia Airport is a 45 minute drive, Newark is 50 and JFK is one hour and 10 minutes.
