                - 'link "The Carlyle, A Rosewood Hotel Photograph: Courtesy Durston Saylor/Rosewood Carlyle Hotel" [ref=f3e1125] [cursor=pointer]':
                  - /url: /newyork/hotels/the-carlyle-a-rosewood-hotel-1
                  - img "The Carlyle, A Rosewood Hotel" [ref=f3e1127]
                  - generic [ref=f3e1128]: "Photograph: Courtesy Durston Saylor/Rosewood Carlyle Hotel"
                - generic [ref=f3e1132]:
                  - paragraph [ref=f3e1133]: The Carlyle, A Rosewood Hotel, (its official name) has a prime location in the center of the elegant Upper East Side. Located a block from Central Park, its central tower can be seen throughout the neighborhood—as intrinsically a part of the upscale area as the flowers of Park Avenue.
                  - paragraph [ref=f3e1134]: "A large part of what’s helped maintain this hospitality icon’s relevance has been its charming, idiosyncratic public venues: Bemelmans Bar, Café Carlyle and—more recently—Dowling’s at the Carlyle. During a recent stay, I was most looking forward to being able to drop in to experience these classic New York spots without having to step outside. With 192 rooms and suites, there is a wide array of options for a night here. We stayed in an Upper East Side Suite which had a separate sleeping area as well as a full kitchen—perfect for those interested in a longer stay. The minimal, Art Deco design felt both modern and timeless. Meanwhile, the full (but quite tiny) kitchen was a useful touch that made our time here feel more like a home away from home than a hotel stay—one of The Carlyle’s superpowers."
                  - paragraph [ref=f3e1135]: Another big bonus of a night here is hopping into one of the historic gold-trimmed elevators and soaring up to your throwback suite. It’s a combination of uniqueness and universality that continues to make The Carlyle a five-star stay and a solid choice for both tourists looking to find a still thriving piece of old New York and locals that want a fun staycation—heavy on the live music and cocktails.
                  - paragraph [ref=f3e1136]:
                    - strong [ref=f3e1137]: "Time Out Tip:"
                    - text: When you’re staying at the hotel, the front desk can assist with nightly reservations to Bemelmans.
