                - generic [ref=f3e516]:
                  - paragraph [ref=f3e517]: Nine Orchard occupies the iconic Jarmulowsky Bank, a historic landmark meticulously restored using its original 1912 blueprints. The Neo-Renaissance architecture makes a striking first impression with vaulted ceilings, pink Tennessee marble floors, and Botticino marble walls. Situated at the top of Orchard Street—recently voted one of the coolest streets in the world—the hotel sits in the heart of the Lower East Side’s indie boutique scene. It is a genuine magnet for tastemakers and celebrities, offering a swish atmosphere that works just as well for a trendy cocktail as it does for an overnight stay.
                  - paragraph [ref=f3e518]: While the public spaces lean into opulent maximalism, the 113 guest rooms offer a calm, mid-century modern retreat. Expect a muted palette, white walls, and graphic artworks that create a relaxed contrast to the grandeur downstairs. Studios and suites feature large windows with gorgeous city views and bathrooms outfitted with classic metro tiles and roomy walk-in showers.
                  - paragraph [ref=f3e519]: The jewel of the property is the Swan Room, a decadent dining space located in the former bank teller hall, where you can find elevated bar snacks like caviar fries and wood-fired oysters. For a more laid-back bistro vibe, the Corner Bar serves globally inspired dishes and a must-try Harvest Negroni. Service is classically New York—efficient and no-nonsense at the desk, yet warm and engaging in the bars.
                  - paragraph [ref=f3e520]:
                    - strong [ref=f3e521]: "Time Out tip:"
                    - text: There’s a seriously cozy perk in the form of exclusive access to a first-floor lounge featuring a real, roaring fireplace. Yes, really.
