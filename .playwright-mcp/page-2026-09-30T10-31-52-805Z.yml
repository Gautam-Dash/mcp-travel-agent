                - generic [ref=f3e2161]:
                  - paragraph [ref=f3e2162]: Just a block from Central Park South, 1 Hotel Central Park is a green hotel combines nature with comfort, the perfect place if you’re looking to be close to the hustle and bustle of midtown and the calmness of Central Park.
                  - paragraph [ref=f3e2163]: When I walked through the large wooden doors of the hotel and stepped inside the lobby, I noticed that the space is filled with nature-inspired decor including glass terrariums, potted plants, and walls of tree bark—all paying homage to the iconic green space just a block away.
                  - paragraph [ref=f3e2164]: I stayed in the City King room which included a bed, small table, TV, king-sized bed and two night tables. The size of the room was comfortable for a Manhattan hotel and the green, nature-focused decor made the room feel so homey. The wood paneling and plants made me feel like I was staying in someone’s well-decorated guest room, which I really enjoyed.
                  - paragraph [ref=f3e2165]: The attention to detail is prominent throughout the entire hotel, from the plants in the lobby to the potted moss on the bedroom windowsills. If you’re looking to stay at a hotel close to the hustle and bustle of midtown Manhattan, while also being a few steps away from Central park, this is definitely the spot.
