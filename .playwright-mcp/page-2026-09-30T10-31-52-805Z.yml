                - generic [ref=f3e252]:
                  - paragraph [ref=f3e253]: The Fifth Avenue Hotel is a boutique masterpiece where every detail, from the silky pleated corridor walls to the hidden reading nooks, has been meticulously curated. Housed within a 19th-century mansion in the heart of NoMad, the hotel features a design scheme by Martin Brudnizki that draws inspiration from global travels and French romanticism. The result is a cabinet of curiosities on a grand scale, filled with richly toned colors, exquisite materials, and palm-filled parlors.
                  - paragraph [ref=f3e254]: The accommodations range from well-appointed queen rooms to sprawling signature suites, all merging historic character with high-tech convenience. Even standard rooms feature luxury amenities like Dyson hair dryers and plush bedding, while suites offer expansive living spaces and dressing tables. Guests enjoy a seamless five-star experience powered by in-room tablets that control the environment and a 24/7 butler service. This service is a standout highlight, offering a warm welcome drink upon arrival and a nightly “martini hour” where a perfectly shaken or stirred cocktail is delivered directly to your door.
                  - paragraph [ref=f3e255]: Dining at the hotel is anchored by the exceptional Café Carmellini, where award-winning chef Andrew Carmellini blends European techniques with New York flair. For a more intimate vibe, the guests-only (until 5pm, when it opens to the public) Portrait Bar serves as a sophisticated retreat for evening cocktails. While the hotel offers a fully equipped gym and partnerships with premier fitness studios like SoulCycle and Barry’s, the real draw is the atmosphere of effortless glamour.
                  - paragraph [ref=f3e256]:
                    - generic [ref=f3e257]:
                      - strong [ref=f3e258]: "Time Out tip:"
                      - text: Its central location puts guests near Madison Square Park and the Empire State Building, with easy subway access to the charm of the West Village or the greenery of Central Park.
