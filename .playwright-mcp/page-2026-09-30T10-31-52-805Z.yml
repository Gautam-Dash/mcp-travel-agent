                  - img "The Ritz-Carlton, New York NoMad" [ref=f3e1077]
                  - generic [ref=f3e1078]: "Photograph: Courtesy Ritz-Carlton Nomad"
                - generic [ref=f3e1082]:
                  - paragraph [ref=f3e1083]: The Ritz-Carlton, New York Nomad is a towering, 50-story beacon of luxury in the rapidly changing neighborhood just north of Madison Square Park. It offers gorgeously appointed rooms with stunning views, excellent dining options and the above-and-beyond hospitality that’s associated with the brand. It’s also, it should be noted, an entirely different vibe than NYC’s other Ritz-Carlton located on Central Park.
                  - paragraph [ref=f3e1084]: "While that hotel conveys a sense of Old New York tradition, this newer offering strikes a lighter note with a heavy dose of contemporary glamor. Situated in the heart of Manhattan, it also has another big thing going for it: an unbeatable location not far from many downtown and midtown hot spots. It’s a great home base for travelers who want to experience the exciting cultural vibrancy of New York City."
                  - paragraph [ref=f3e1085]:
                    - generic [ref=f3e1086]: The 219 guestrooms and 31 suites at
                    - text: The Ritz-Carlton, New York Nomad are spacious and filled with light thanks to oversized windows with jaw-dropping views from the Empire State Building down to the Statue of Liberty.
                  - paragraph [ref=f3e1087]: The hotel’s culinary offerings by Michelin-starred chef José Andrés are also notable. The Lobby Lounge and Bar, located on the first floor, is a great spot to grab a pastry to start your day or a nightcap to end it. Zaytinya, also found on the ground floor, has a mezze menu inspired by Turkish, Greek and Lebanese cuisines that’s served in a room with pops of blue coloring inspired by the Mediterranean. Meanwhile, be sure to make a reservation at Nubeluz, the hotel’s sleek rooftop bar with panoramic views of the city. The experience of sipping a classic cocktail in the elevated throwback space is one to savor.
                  - paragraph [ref=f3e1088]:
                    - generic [ref=f3e1089]: Guests looking to keep up with their fitness or self-care routines are also in luck. The 6,800-square-foot signature Ritz-Carlton Spa and Fitness Center can be found on the lower level with eight treatment rooms as well as separate sauna and steam rooms.
                    - strong [ref=f3e1090]: "Time Out Tip:"
                    - text: Double check to see if your room provides access to the hotel’s Club Level with more city views and complimentary culinary offerings from José Andrés.
