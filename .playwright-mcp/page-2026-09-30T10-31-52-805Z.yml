                - generic [ref=f3e2008]:
                  - paragraph [ref=f3e2009]: Exposed brick walls covered in local artwork, 13-foot ceilings sporting original wood beams, floor-to-ceiling factory windows offering panoramic skyline views—the Wythe Hotel is a Brooklyn real estate wet dream. Alas, unless you’re one of the tech bros who have transformed the Williamsburg waterfront into one of the city’s wealthiest neighborhoods, you likely can’t afford those kind of industrial-chic digs full-time, but the Wythe allows you to at least pretend that this is your not-so-humble abode for a few days.
                  - paragraph [ref=f3e2010]:
                    - generic [ref=f3e2011]:
                      - text: Directly across the street from
                      - link "Brooklyn Brewery" [ref=f3e2012] [cursor=pointer]:
                        - /url: https://www.timeout.com/newyork/bars/brooklyn-brewery
                      - text: ", all of that quintessentially North Brooklyn cool is housed inside a former early-20th-century cooperage, which was turned into a 69-room boutique hotel in 2012. Though the factory feel is still evident, what with"
                    - generic [ref=f3e2013]: the cast-iron pipework and poured concrete floors in the guest rooms—that flooring is heated, FYI, but could use a few area rugs not only for comfort but also sound absorption—it’s been glammed up for the gentrified ‘hood.
                    - generic [ref=f3e2014]: Cheery
                    - text: Chateau Toile wallpaper custom-designed by artist Dan Funderburgh cover the walls, the reclaimed-timber beds are piled with plush Downlite pillows, and buttery leather sectionals are set beneath large glass chandeliers in the North 7th Loft that I stayed in, a spacious corner suite with a generous minibar area (stocked with BonBon’s viral Swedish candies and bottles of No. 80 Whiskey, the hotel’s exclusive batch with neighbor NY Distilling Co.) and a double-vanity bathroom with Davines toiletries and a deep pedestal tub.
                  - paragraph [ref=f3e2015]:
                    - strong [ref=f3e2016]: "Time Out tip:"
                    - text: The Wythe doesn’t have a gym, but if you need to get a bench session in during your stay, guests are entitled to free access to Brooklyn Athletic Club, a five-minute walk away.
