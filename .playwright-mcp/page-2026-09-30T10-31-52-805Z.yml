                  - generic [ref=f3e1554]: "Photograph: courtesy The Beekman Hotel | The penthouse north terrace at The Beekman Hotel"
                - generic [ref=f3e1558]:
                  - paragraph [ref=f3e1559]: This architectural gem with eight tiered galleries served as the atrium to one of Manhattan’s very first skyscrapers—Temple Court—when it was built in 1881. Today, you can still see its original cast iron railings and balustrades, gorgeous millwork around its doorways and encaustic tiles featuring reds, browns and golds thanks to its successful restoration in 2016 by Gerner Kronick + Valcarcel Architects. The atrium sure is the star of the show at the Beekman, but it’s not the only one.
                  - paragraph [ref=f3e1560]: The Beekman, a Thompson Hotel as of 2022, offers a cozy but stylish stay with 287 rooms to book out (from studios to Queen, Deluxe and King suites with and without terraces as well as two turret penthouses), a 24-hour gym and an incredibly comfortable lobby that greets you with its own luxurious branded scent, Beekman 1802! Fresh Air. It boasts two highly-rated restaurants—Le Gratin by Chef Daniel Boulud and Temple Court by Tom Collichio—and the stunning Bar Room under the atrium.
                  - paragraph [ref=f3e1561]: On the ninth floor, my studio suite faced an inner courtyard so the noise of the city did not reach me, immediately easing my nerves. The king-size bed was luxurious—its sateen Sferra linens were heavenly soft and paired with the D.S. & Durga soaps and lotions in the rainbath shower, I slept incredibly well. It’s no doubt the black out curtains aided my deep slumber.
                  - paragraph [ref=f3e1562]: The Beekman should be on your list of hotels to stay at in New York City or at the very least, one to go gawk at (and order a drink at the bar).
                  - paragraph [ref=f3e1563]:
                    - strong [ref=f3e1564]: "Time Out tip:"
                    - text: The best part of the stay, though, was being able to dine downstairs at Le Gratin, chef Boulud’s Lyonnais-inspired bistro that
                    - link "we awarded five stars to in 2022" [ref=f3e1565] [cursor=pointer]:
                      - /url: https://www.timeout.com/newyork/restaurants/le-gratin
                    - text: and simply go upstairs to my room—the shortest commute ever. Ask the concierge to get you a reservation to Le Gratin or Temple Court.
