                  - paragraph [ref=f3e595]: An all-encompassing luxury lifestyle experience, the Equinox Hotel is a standout oasis within Hudson Yards, the glittering mixed-use development on Manhattan’s far west side. Set within a handsome 92-story glass and limestone tower, the hotel offers a wellness experience that feels more like a high-end resort than a standard city stay. Physically removed from the typical Midtown hustle, it provides a true escape where guests can indulge in a 60,000-square-foot fitness club, a rooftop pool with sweeping Hudson River views, and a world-class spa offering everything from cryotherapy to specialized facials.
                  - paragraph [ref=f3e596]: The rooms, designed by Rockwell Group, are a masterclass in grayscale monochromatic minimalism. While the aesthetic mirrors the brand’s fitness clubs, the environment is undeniably soothing and luxurious. Floor-to-ceiling windows frame the city or river, while the “sleep system” features blackout shades and extremely comfortable beds—interestingly styled with duvets folded to resemble sculpted abs. Thoughtful details abound, including a minibar stocked with health supplements and gym clothes for those who traveled light. The spacious marble bathrooms feature rainfall showers and Grown Alchemist products designed to invigorate in the morning and relax at night.
                  - paragraph [ref=f3e597]: Dining centers around Electric Lemon, a buzzy 24th-floor restaurant with a fashionable terrace that feels more like Miami than New York. The menu offers upscale, seasonal American fare, ranging from crispy-skinned branzino to indulgent steak tartare.
                  - paragraph [ref=f3e598]:
                    - strong [ref=f3e599]: "Time Out tip:"
                    - text: While the scene at Electric Lemon is enticingly glam (and the service across the hotel is exceptionally personable) the prices are high—guests may find more value at nearby spots like Ci Siamo.
