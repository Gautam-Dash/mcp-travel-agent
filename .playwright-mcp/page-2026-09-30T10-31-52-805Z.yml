                - generic [ref=f3e2203]:
                  - paragraph [ref=f3e2204]: "The 131-room FiDi Hotel aims to be ‘a welcome harbor for business travelers and holidaymakers in New York City’s Financial District’, and welcome it is: though similarly priced, the FiDi Hotel is immediately substantially cooler than the DoubleTree by Hilton rooted right across the street, with friendly, recommendation-ready staffers at the concierge desk and some rogue disco balls pepping up the industrial rawness of the lobby space."
                  - paragraph [ref=f3e2205]: Designed by the New York-based firm Kroesser + Strat Design, the Stone Street building itself features a multi-colored, Piet Mondrian-inspired glass façade, hinting at the modern sleekness highlighted within.
                  - paragraph [ref=f3e2206]: Ranging from 151-square-foot Superior Queen accommodations to 283-square-foot Executive King suites, each guest room is edgily dressed with wood-motif wallpaper, brass light fixtures and bold black-and-white artwork, along with thoughtfully luxe touches like SMEG mini-fridges, high-fashion art books and sumptuous white linens. Though clean and spacious, the bathrooms are slightly less than tranquil with their dizzying, all-over geometric tiles, and could benefit from some storage. Similarly, the larger suites with private terraces and floor-to-ceiling windows are well worth the splurge, but could make better use of their square footage in the living room space—if you want to enjoy your complimentary coffee from the hotel’s second-floor lounge (where, graciously, there is plenty of seating) or a surprise bottle of bubbly from the reception staff, there’s really nowhere to set it down in the sofa area.
                  - paragraph [ref=f3e2207]: Speaking of drinks, there is a bar on premises—the SpareChange Lounge on the 30th and 31st floors, which is glammed up with velvet mid-century seating, a statement marble bar and more of those fun-loving disco balls.
                  - paragraph [ref=f3e2208]:
                    - strong [ref=f3e2209]: "Time Out tip:"
                    - text: If it’s your first time staying in the Financial District, the hotel offers a handy ‘Stay and Stroll’ package for a three- or five-night stay, which includes a walking tour of Lower Manhattan hosted by Interboro Tours.
