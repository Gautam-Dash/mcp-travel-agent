                - generic [ref=f3e1801]:
                  - paragraph [ref=f3e1802]: After a warm greeting from the front desk staff—who offered me a complimentary glass of champagne (yes, please)—I headed to my deluxe king room.
                  - paragraph [ref=f3e1803]: Awash in gray and white tones, the spacious room fit a king-size bed, a large desk, plenty of closet space and a minibar stocked with local snacks. Oversized black-and-white photographs that capture vintage New York scenes and celebs sipping Manhattans elevate the design and make sure the gray palette doesn’t feel sterile. The room’s sweeping windows looked out onto the triangle park known as Bogardus Plaza and into red-brick artists’ studios where I even noticed a photoshoot underway. Other rooms look out onto the southern tip of Manhattan with the World Trade Center in view.
                  - paragraph [ref=f3e1804]: En-suite bathrooms echo the bedroom’s color scheme and add marble tiling, plenty of counter space for getting ready to go out, and MALIN+GOETZ products. In my room, the shampoo, conditioner, and body wash were mounted beneath the shower head, which meant that shampoo pumped into my hand tended to wash away before it could get to my hair; I wish the products were mounted on the back of the shower instead.
                  - paragraph [ref=f3e1805]: In total, the hotel contains 100 rooms, including 12 suites, four corner king rooms and a penthouse with a dining area and a spacious balcony. Guests can work out in the hotel’s small but equipped gym, which includes a Peloton bike.
                  - paragraph [ref=f3e1806]: While there are tons of excellent dining options in Tribeca, it’s definitely worth having dinner at the hotel’s Smyth Tavern, a warm American-style spot next to the lobby.
                  - paragraph [ref=f3e1807]:
                    - strong [ref=f3e1808]: "Time Out tip:"
                    - text: Call the hotel to inquire about the
