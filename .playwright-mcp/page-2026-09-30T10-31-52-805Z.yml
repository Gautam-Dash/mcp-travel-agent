                  - paragraph [ref=f3e1658]: This 124-room Upper West Side property opened in October 2020, bringing with it boutique-style sophistication to the largely residential neighborhood. That luxuriousness starts in the chicly dressed lobby, where you’re greeted by geometric black-and-white tiled floors, a kinetic clock sculpture by Per Emanuelsson and a large marble reception desk manned by an exceedingly attentive staff.
                  - paragraph [ref=f3e1659]: Through a golden curtain on the ground level, you’ll also find the Wallace Lounge, a swanky Deco-style cocktail bar festooned with jewel-toned velvet sofas, an atmosphere-boosting fireplace and a 1920s Mason & Hamlin grand piano whose ivories get regularly tickled during near-nightly jazz performances.
                  - paragraph [ref=f3e1660]: Upstairs in the spotless guest rooms, the vibes are far more serene (though my stay did admittedly feature a low soundtrack of construction from the next-door building). Swathed in soft neutrals, sober pastels and sleek brass finishes, accommodations range from comfortable queen bedrooms (250 square feet) to apartment-style suites with kitchenettes, separate sitting rooms and private terraces (580 square feet).
                  - paragraph [ref=f3e1661]: Along with the expected creature comforts—cozy robes and slippers, large rainfall showers and all—each room features a surprising amount of tech-driven amenities, including Chromecast-friendly flatscreens, electronic window shades and touch-controlled lighting throughout. (I was especially thankful for the handy nightlight option, which graciously meant I didn’t bash a hip into the marble bathroom counter in the wee hours of the night.) In a city full of soulless chain hotels, it’s those thoughtful details that will leave you asking, ‘Times Square who?’
                  - paragraph [ref=f3e1662]:
                    - strong [ref=f3e1663]: "Time Out tip:"
                    - text: Sure, you can get a solid classic martini at the hotel lounge but why not upgrade your order with the Baiki Martini ($35), which crowns crisp Grey Goose with briny caviar pearls.
