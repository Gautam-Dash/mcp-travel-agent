                - generic [ref=f3e2065]:
                  - paragraph [ref=f3e2066]: Long Island City’s best lobby for working and using the free Wi-Fi is at the Boro Hotel. But it’s also the type of lodging ideal for couples and adult friends who might want to come to a space that feels big and airy after a long day of trudging through Manhattan. If you book a stay here, try to book a room with views of Manhattan—the sweeping views of the Queensboro Bridge and the Upper East Side are pretty difficult to match.
                  - paragraph [ref=f3e2067]: The elegant industrial lobby was designed by the firm Grzywinski + Pons (also behind the Hotel on Rivington in the Lower East Side), and has lots of natural light, tables and chairs, modern sofas, a fireplace and bookshelves curated by Strand Books in Union Square.
                  - paragraph [ref=f3e2068]: Rooms and suites have a similar minimalist feel, thanks to mid-century modern furniture, stark white linens and hanging edison bulbs. Non-guests can order coffees at the cafe and drinks at the lobby bar, or also check out their new-ish restaurant Beebe’s, which serves some pretty solid brick oven pizzas, pastas and a killer ricotta.
                  - paragraph [ref=f3e2069]: While this might feel worlds away from the buzz of Manhattan, from the Boro Hotel it’s very easy to reach. Hop on the 7 train and you’ll be in Midtown in under 30 minutes.
                  - paragraph [ref=f3e2070]:
                    - strong [ref=f3e2071]: "Time Out Tip:"
                    - text: Don’t cross the East River into Manhattan without first checking out
