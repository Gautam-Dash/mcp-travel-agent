                - generic [ref=f3e2259]:
                  - paragraph [ref=f3e2260]: Pass under the quintessential New York black awning and rotate through the revolving door into the Sofitel New York, the brand’s revamped North American flagship. The lobby is a lengthy, imposing, Art Deco-inspired lair that offers a warm, lowly illuminated welcome from the city streets. While the layout is slightly bizarre—requiring a walk past a glitzy statement staircase to reach reception—floating staff ensure the check-in process is seamless. This Midtown base brims with potential, balancing a “French zest” with the professional, efficient expertise of a seasoned business hotel.
                  - paragraph [ref=f3e2261]: The guest rooms are a primary draw, ranging from generous 350-square-foot units to a lavish 1,205-square-foot penthouse. In the Prestige One-Bedroom King Suite, floor-to-ceiling windows and a clever circular layout provide a sense of space rarely found in Manhattan. While the beige marble bathrooms feel slightly dated, the functionality is top-tier, featuring piping-hot showers and floral Diptyque toiletries. The true standout is the Sofitel MyBed™, a doughy, feather-top mattress with satiny sheets and supportive pillows that provide some of the comfiest sleep imaginable. It is an ideal sanctuary for Big Light haters, kitted out with plenty of well-placed lamps.
                  - paragraph [ref=f3e2262]: Service here is polished and experienced; many employees have been on-site since the hotel opened 25 years ago. While the on-site restaurant, Social 45, feels a bit cookie-cutter, room service is prompt and high-quality. Ultimately, the hotel’s greatest asset is its unbeatable location on West 44th Street. With the Rockefeller Center, Broadway, and Bryant Park just a short stroll away, it serves as a reliable, high-end base for those looking to maximize their time at the heart of Manhattan.
                  - paragraph [ref=f3e2263]:
                    - strong [ref=f3e2264]: "Time Out tip:"
                    - text: Head to either
                    - link "Nisran’s Kitchen" [ref=f3e2265] [cursor=pointer]:
                      - /url: https://www.timeout.com/newyork/restaurants/nasrins-kitchen
                    - text: or
                    - link "Kochi" [ref=f3e2266] [cursor=pointer]:
                      - /url: https://www.timeout.com/newyork/restaurants/kochi
                    - text: for good, local dinner spots.
