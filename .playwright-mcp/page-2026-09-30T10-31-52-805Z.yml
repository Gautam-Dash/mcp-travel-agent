                  - paragraph [ref=f3e1453]: If you’re looking for a Gilded Age, old-money historic NYC experience, Lotte New York Palace on Madison Avenue is just the place. Lotte Palace was built during the Gilded Age, 1882 to be exact.
                  - paragraph [ref=f3e1454]: The lobby, courtyard and the main hotel building comprise three wings of the Villard Houses, a row of mansions built in the 1880s by McKim, Mead & White (which are New York City-designated landmarks and listed on the National Register of Historic Places) for railroad tycoon Henry Villard. I entered the building through the main lobby, walking through its notorious courtyard, which is immediately recognizable from the over 25 movies and TV shows filmed there. Through the heaviest revolving door I’ve pushed in a while and stepped back in time, surrounded by the type of ostentatious grandeur that isn’t made anymore.
                  - paragraph [ref=f3e1455]: The lobby features multiple staircases, two of which lead to the second-floor balcony and its giant pink marble fireplace. Marble statues of Greek goddesses adorn the gold leaf-plated banisters. It should feel almost gaudy, but instead, it feels exciting and luxurious.
                  - paragraph [ref=f3e1456]: Its luxury bar, The Gold Room, boasts drinks costing upwards of $25 and rooms average around $650, but it seems that’s the price you pay for living like a Gilden Age billionaire. After pressing every button in the room to create a confusing light show, we headed down there to get a flavor of the old-money glamor this place is dripping with, and it did feel incredibly romantic.
                  - paragraph [ref=f3e1457]:
                    - strong [ref=f3e1458]: "Time Out tip:"
                    - generic [ref=f3e1459]:
