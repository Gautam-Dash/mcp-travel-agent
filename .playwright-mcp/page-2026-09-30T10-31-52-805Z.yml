                - generic [ref=f3e1397]:
                  - paragraph [ref=f3e1398]: This classic, five-star hotel sits right on the southeastern edge of Central Park at Fifth Avenue and 61st Street and is by far the best hotel stay I’ve had in New York. Its understated elegance is felt as soon as you walk into the lobby, which plays host to myriad lavish events throughout the year.
                  - paragraph [ref=f3e1399]:
                    - text: After my stay here, I can see why it’s so iconic, having featured in films like
                    - emphasis [ref=f3e1400]: First Wives Club, Meet Joe Black
                    - text: and
                    - emphasis [ref=f3e1401]: Oceans 8.
                    - text: It’s also hosted luminaries like Coco Chanel, Karl Lagerfeld, Andy Warhol, Hubert de Givenchy, Elizabeth Taylor, Audrey Hepburn, Yves Saint Laurent, Barbra Streisand, Joan Collins (and many UN delegations) over the many decades and you can see them represented in the hotel’s incredible candid photos by Ron Galella that line its main hallway.
                  - paragraph [ref=f3e1402]: But where The Pierre really shines is in the details, which make it feel like home (if you can call a glamoros place like this home, that is). Check-in was a breeze with staff who welcomed me heartily and offered freebie chocolate from Mariebelle, which has a little shop on-site.
                  - paragraph [ref=f3e1403]: Friendly attendants, many of whom have been at The Pierre for decades, rode the elevator up with me, pressing the button to my floor. Inside my luxe carpeted room, which was outfitted with a king-size bed featuring a tufted headboard and a window overlooking Central Park, complimentary water bottles, tea and a NYC chocolate display with a fondant subway sign, a mini sculpture of the Empire State Building, macarons and truffles, and a personalized note thanking me for my stay, were waiting for me.
                  - paragraph [ref=f3e1404]:
                    - strong [ref=f3e1405]: "Time Out Tip:"
                    - text: The Pierre’s Two E Bar & Lounge is a great spot for grabbing drinks and taking in live jazz from Modern Martinis Music, every night, Tuesday through Saturday. Book a table!
