                - generic [ref=f3e972]:
                  - paragraph [ref=f3e973]: Sometimes when you’re planning a trip to NYC, you just want a classic New York experience. Well, The Peninsula New York is that hotel. That’s due, in large part, to a winning combination of its landmarked 1905 Beaux Arts building and a new state-of-the-art renovation.
                  - paragraph [ref=f3e974]: This hotel is for travelers looking for an elevated experience in the center of NYC. It’s perfect for those looking for a homebase that feels more like a luxury apartment building than a bespoke boutique experience—as well as a location that offers extensive spa and wellness options. Thanks to its recent renovation, the suites have a new freshness and polish and provide a high level of comfort whether you have an in-tub television or not.
                  - paragraph [ref=f3e975]: The indoor pool here is one you’ll remember for quite some time. It sits gleaming behind floor-to-ceiling windows which offer panoramic city views, and is unlike any pool I’ve ever seen in New York. Connected via a staircase to the hotel’s award-winning spa, I’d recommend booking in for a (delightfully firm) 60-minute signature massage with added aromatherapy.
                  - paragraph [ref=f3e976]: The location? You can’t really beat it. The Peninsula sits on Fifth Avenue between Central Park and the Rockefeller Centre, feeling not just like it’s smack-dab in the middle of Midtown, but of the planet. MoMA is round the corner, but so are a long list of top Manhattan attractions.
                  - paragraph [ref=f3e977]:
                    - strong [ref=f3e978]: "Time Out tip:"
                    - text: From November through March, you can rent a private outdoor igloo for an evening on the hotel’s rooftop.
