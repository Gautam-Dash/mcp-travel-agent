                - generic [ref=f3e898]:
                  - paragraph [ref=f3e899]: Hotels don’t come with much more cultural cache than the Chelsea Hotel (its new owners will insist you call it The Hotel Chelsea, but we’re pretty sure that’ll never stick). From Leonard Cohen and Patti Smith to Dylan Thomas, Iggy Pop and Stonewall icon Stormé Delarverie, the majestic red brick building—with its French Quarter style balustrades and legendary neon sign—has been home to a hilariously lengthy list of truly inspirational artists, renegades and creatives. Taylor Swift also has a song about it.
                  - paragraph [ref=f3e900]: Finally open to the public after a decade or so of legal wrangling and redevelopment, the 155-room hotel has certainly been given a lick of fresh paint, but the dreamy, pleasantly ragged apartment-building style air remains. Like Los Angeles’ Chateau Marmont before it, it feels upkept rather than updated; there are wooden floors throughout, ornate brass fixtures, and suites feel lived-in and homely, with mismatched furniture; velvet sofas, comfy cushions, leopard-print chairs and antique writing desks. There are other sweet touches too, such as monogrammed sheets, robes, and slippers.
                  - paragraph [ref=f3e901]: The grand, original Victorian staircase is also worth wandering up, lined as it is with art, much of it supplied by one-time residents. There are a few completely new touches—a fabulously decadent but still fittingly offbeat spa on the top floor comes complete with a purple tile-lined steam room, treatment rooms with floor-to-ceiling windows and outdoor balconies with serious city views.
                  - paragraph [ref=f3e902]:
                    - strong [ref=f3e903]: "Time Out tip:"
                    - text: If you’re dining at the hotel, eschew the new French bistro Café Chelsea in favor of the storied El Quijote, a camp-y Spanish spot on site that dates back to 1930 and was a favorite of Andy Warhol.
