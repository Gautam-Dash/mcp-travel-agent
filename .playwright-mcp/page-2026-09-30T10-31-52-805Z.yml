                - generic [ref=f3e1859]:
                  - paragraph [ref=f3e1860]: Nestled on the corner of North Moore Street and Greenwich Street right by the West Side Highway, the Greenwich Hotel boasts 73 rooms, some of which overlook an interior courtyard, 11 suites and two duplex penthouses that are aptly named The Greenwich and The North Moore.
                  - paragraph [ref=f3e1861]: On a recent visit while staying in a luxurious suite on the second floor, I almost forgot I was in New York. When looking out the window and into the courtyard, I noticed the absence of the very things that make the city what it is on a visual level. There were no buildings, no people rushing down the street and all was unbelievably peaceful.
                  - paragraph [ref=f3e1862]: "Despite the disconnect from its surroundings, the hotel offers a premium experience when it comes to your actual stay: the beautiful bathroom, complete with a shower and a bath, was stocked with Red Flower products developed specifically for the hotel and the bed, by British company Savoir, was particularly comfortable. But there’s more: guests receive a complimentary newspaper every morning and the mini bar is filled with non-alcoholic drinks and snacks to be enjoyed completely gratis (keep in mind that the en-suite alcohol comes at a price—and we’re not just talking about a hangover)."
                  - paragraph [ref=f3e1863]:
                    - generic [ref=f3e1864]: "Most astounding, though, were the two main experiences adjacent to the traditional hotel: the on-site Shibui Spa, modeled after a Japanese onsen, and Locanda Verde, the famous Italian taverna that celebrity chef Andrew Carmellini opened in 2009."
                  - paragraph [ref=f3e1865]:
                    - strong [ref=f3e1866]: "Time Out tip:"
                    - text: Make a reservation at Locanda Verde and book your treatment at Shibui Spa as soon as you call about your room. Both spots are extremely popular!
