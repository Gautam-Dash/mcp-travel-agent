                - generic [ref=f3e1609]:
                  - paragraph [ref=f3e1610]:
                    - text: Michelin is known for awarding restaurants with stars, but it recently expanded its expertise by awarding hotels with
                    - link "Michelin Keys" [ref=f3e1611] [cursor=pointer]:
                      - /url: https://www.timeout.com/newyork/news/27-new-york-city-hotels-have-been-awarded-michelin-keys-042424
                    - text: . The Bowery Hotel in East Village was recently awarded one Key, ranking it as a ‘Very Special Stay,’ and the organization was right.
                  - paragraph [ref=f3e1612]: Walking through the double doors of The Bowery Hotel felt like I was walking into a different era. The decor was classy and masculine—with antique couches and chairs placed throughout the large space. I was greeted by the kind bellhops and checked into my room.
                  - paragraph [ref=f3e1613]: I took the dimly lit (and old but well-maintained) elevator up to the 12th floor and walked into my room, which had breathtaking views of Manhattan and Brooklyn (I had a perfect view of the newly renovated Domino Sugar factory!) and I stayed in the Bowery King room. It was incredibly comfortable, with lots of spaces to sit and relax. I loved being able to sit at the table on one side of the room and then move to the other side and sit on the couch while enjoying different views of the city.
                  - paragraph [ref=f3e1614]: The attention to detail is evident in every corner of the hotel, from the lobby lounge and hotel restaurant to the room. The Bowery Hotel is the perfect place for a staycation or if you’re planning to visit Manhattan and want to explore downtown.
                  - paragraph [ref=f3e1615]:
                    - strong [ref=f3e1616]: "Time Out tip:"
                    - text: Sure, most first-timers will prioritise hitting Midtown, but you’re on the border of the East Village at The Bowery Hotel, so make sure to leave aside some time for dive-bar hopping and thrift shopping.
