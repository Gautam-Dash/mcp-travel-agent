                - generic [ref=f3e1959]:
                  - paragraph [ref=f3e1960]: This hotel is perfect for anyone looking for a fuss-free stay on one of New York City’s most exciting streets. I entered through the Spring Street entrance and was greeted by a lobby that blends modern and mid-century styles, featuring dark wood and plenty of cozy nooks to sit, read, take a call, or get some work done. Distinct hanging steel-caged light fixtures and wood panels reminiscent of church organs make up the very tall walls.
                  - paragraph [ref=f3e1961]: I stayed in a Skyline View King Room, which consists of a king-sized bed, a sofa and coffee table, desk space and a wet bar. The room was spacious and the views were fantastic. It was a well-kept space; the robes were soft, and the bathroom featured both a standing shower and a full tub. The tub even has a TV you can pull out to watch while soaking. The toiletries were all by Diptyque, and the subtle scent of high-end fragrances lingered in the air—I must say, I didn’t hate that at all.
                  - paragraph [ref=f3e1962]: The hotel offers a nice mix of amenities, including a spa (some suites even have saunas) and a terrace pool, allowing you to relax or swim seven stories above Soho. The pool is adjacent to the hotel restaurant, El Ta’Koy, which serves Hawaiian-style street food.
                  - paragraph [ref=f3e1963]: The Dominick is a well-cared-for hotel, offering everything you need for a comfortable and relaxing stay. It’s elevated by its amazing views, chic poolside restaurant, and prime location on Spring Street, with all of Soho at its doorstep.
                  - paragraph [ref=f3e1964]:
                    - strong [ref=f3e1965]: "Time Out tip:"
                    - text: There’s complimentary coffee and pastries served at the hotel, but they’re easy to miss! You’ll find this buffet breakfast on the 7th floor, not the lobby like in many other hotels.
