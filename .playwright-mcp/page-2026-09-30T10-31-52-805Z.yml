                  - paragraph [ref=f3e1747]:
                    - generic [ref=f3e1748]: Having opened its doors in October 2023, Kimpton Theta offers a calm, relaxing space just minutes away from the hustle and bustle of Manhattan. The 364-room hotel is located on 8th Avenue and is walking distance from the Theater District, Times Square, Hell’s Kitchen and Central Park South—making it the perfect launch point for exploring all of midtown. Only a nine-minute walk from
                    - text: Radio City Music Hall
                    - generic [ref=f3e1749]: and
                    - text: Rockefeller Center, it’s a great place to stay if you’re visiting during the holiday season.
                  - paragraph [ref=f3e1750]: Kimpton Theta’s lobby was filled with comfortable furniture, beautiful decor, lush plants and curtains that keep you separated from the business of 8th Avenue. The design is inspired by the Theta brainwaves that are most present in moments of meditation, which was clear upon entering. It includes a marketplace with snacks, drinks and hotel merchandise—like comfortable robes and reusable bottles, as well as a coffee window that serves freshly brewed coffee and breakfast pastries.
                  - paragraph [ref=f3e1751]:
                    - generic [ref=f3e1752]: It also has a gym with weights and Peloton bikes, as well as bikes you can rent and use to explore the city. Every evening, from 5pm to 6pm, the hotel offers a complimentary wine hour where guests can enjoy a glass before catching a Broadway show or grabbing dinner, which is exactly what I did before heading to
                    - text: John’s of Times Square.
                  - paragraph [ref=f3e1753]: Finding a hotel in New York City that’s spacious can be tough, but this room offers plenty of space. Not only was there ample space for luggage, shoes and winter coats, but it was big enough for a couch and table to fit near the window. I stayed in the King Room and it was extremely comfortable, from the warm lighting to the soft bed. The service is great, too. I wanted to make coffee the next morning, so they brought up a coffee maker.
                  - paragraph [ref=f3e1754]:
                    - generic [ref=f3e1755]:
                      - strong [ref=f3e1756]: "Time Out tip:"
                      - text: Be sure to check out the rooftop restaurant. There’s a daily happy hour there for hotel guests—cheers to that!
