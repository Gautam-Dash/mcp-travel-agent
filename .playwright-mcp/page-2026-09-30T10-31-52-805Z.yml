                    - generic [ref=f3e1288]: This historic space was transformed and opened as a hotel in 2022 by the Paspaleys, the family behind Australia’s oldest pearling company. Nods to that nacre past beautifully abound throughout the warmly luxurious property, from the
                    - text: rare pearl jewelry showcased in the lobby to the scallop-edged barstools in the lounge to the oyster-inspired watercolors that hang above the Frette-sheeted beds in each guest room.
                  - paragraph [ref=f3e1289]:
                    - generic [ref=f3e1290]: Soothing soft blues and seafoam greens wash over the spacious staterooms—ranging in size from a comfortable 300-square-foot king to the expansive 800-square-foot
                    - text: Otto Suite, with connecting rooms available—a far more elegant maritime reference than your usual swashbuckling ropes and nautical stripes.
                  - paragraph [ref=f3e1291]:
                    - generic [ref=f3e1292]: The plush velvet pillows, flickering fireplace, thoughtfully appointed minibar (along with treats, it’s stocked with
                    - text: custom-designed oyster-inspired gifts for sale,
                    - generic [ref=f3e1293]:
                      - text: "with proceeds benefiting the Billion Oyster Project’s ongoing efforts to restore the nearby New York Harbor) and deep soaking tub (complete with Le Labo products and heated bathroom floors) beckon you to turn on that OOTO message. But the Carnegie Suite I stayed in did also conveniently feature a writing desk, in case you choose to answer that work email during your stay. Not me, though: I was too busy diving into the depths of the raw-bar menu at the in-building brasserie"
                      - link "La Marchande" [ref=f3e1294] [cursor=pointer]:
                        - /url: https://www.timeout.com/newyork/news/another-splashy-new-french-restaurant-just-opened-in-manhattan-061722
                      - text: ", from Michelin star-awarded chef John Fraser."
                  - paragraph [ref=f3e1295]: For a stay that glamorously honors the New York neighborhood around it while feeling like a transportive respite set far from the economic hustle and bustle of FiDi, let the comforts of the Wall Street Hotel wash over you.
                  - paragraph [ref=f3e1296]:
                    - strong [ref=f3e1297]: "Time Out tip:"
                    - text: Having sleep troubles? The teched-out Great Pearl Suite on the 14th floor offers a personalized, restorative sleep experience featuring the Bryte Balance mattress.
