                - generic [ref=f3e1178]:
                  - paragraph [ref=f3e1179]: Taking over the iconic former Le Parker Meridien space on West 56th Street, the Thompson Central Park underwent a major mid-pandemic facelift by architect Thomas Juul-Hansen and designers Stonehill Taylor and officially opened in November 2021. The result is mid-century modern sleekness—this is a Thompson property, after all—throughout both the public spaces and private guestrooms.
                  - paragraph [ref=f3e1180]:
                    - generic [ref=f3e1181]:
                      - text: "Soaring with 36-foot-high ceilings, the large-scale lobby features crushed-velvet sofas, contemporary artworks and colossal statement chandeliers, as well as two of the hotel’s stellar food-and-drink options: the jazzy all-day lounge Parker’s, which serves up live tunes, a solid Cosmo ($25) and New York-y plates like a Wagyu chopped cheese ($27) and a truffle-sauced ‘dirty water’ dog ($23); and patty ‘speakeasy’ Burger Joint, a Le Parker Meridien leftover that’s been serving one of"
                      - link "the city’s most famed hamburgers" [ref=f3e1182] [cursor=pointer]:
                        - /url: https://www.timeout.com/newyork/restaurants/best-burgers-nyc
                      - text: for the past two decades. (The fine-dining restaurant
                      - link "Indian Accent" [ref=f3e1183] [cursor=pointer]:
                        - /url: https://www.timeout.com/newyork/restaurants/indian-accent-1
                      - text: —which I awarded four stars when it debuted back in 2016—is also located right next door.)
                  - paragraph [ref=f3e1184]: "The 587 guest quarters mirror the lobby’s sophistication, ranging from a refined though standard-sized double bed option to the substantially more spacious and sumptuous Thompson Suite. Unsurprisingly, the rooms’ swankiness increases the higher up you go: set between floors 26 and 33, the so-called Upper Stories abodes are a decidedly upgraded guest experience, one that I found completely worth it during my stay."
                  - paragraph [ref=f3e1185]: Along with an expedited private check-in on the hotel’s third floor, the Upper Stories designation means you get priority access to the building’s on-property restaurants and residents-only gym but an exclusive lounge with free coffee, soft drinks and snacks (much-appreciated since the rooms don’t have much of a mini bar), large flatscreens and plenty of comfy seating.
                  - paragraph [ref=f3e1186]:
                    - strong [ref=f3e1187]: "Time Out tip:"
                    - text: If you want to take advantage of that park proximity, the Thompson offers a Picnic in the Park package!
