                - generic [ref=f3e1346]:
                  - paragraph [ref=f3e1347]: Eight years since its opening, the 1 Hotel Brooklyn Bridge continues to redefine hotel sustainability in ‘the city that never sleeps’. Upon walking in, we were greeted by an airy, plant-filled lobby with loads of guests and digital nomads working away, and a charismatic set of staff dressed in casual denim from head to toe—both signs that we were in fact, in New York, and steps away from the natural world that keeps us afloat.
                  - paragraph [ref=f3e1348]: During our stay, we couldn’t help but notice the little details that reminded us what it means to live sustainably and in tune with our environment. Room keys and interiors made of reclaimed wood, an engraved rock inviting guests to recycle their used clothing, sand timers in the shower, a filtered water system separate from the sinks in every room, a farmstand beside the lobby elevators, even the bridge and park views all served as moments of mindfulness.
                  - paragraph [ref=f3e1349]: From bottom to top, the 1 Hotel Brooklyn Bridge has built in services, amenities, and a genuine sense of hospitality that makes you feel as though you never have to leave (or would want to leave). The Bamford Wellness Spa offers a wide range of treatments, including a steam room and relaxation lounge. On the same floor is a co-working space, and The Osprey, a farm-to-table restaurant that does not lack East River views either.
                  - paragraph [ref=f3e1350]: Floor Two continues 1 Hotel’s theme of wellness with its state-of-the-art gyms, personal training services, and communal yoga classes. After 194 rooms and suites with floor-to-ceiling windows, we reached Harriet’s Lounge on 10R, which boasts leather booths, creative cocktails, and seasonal apps.
                  - paragraph [ref=f3e1351]: Harriet’s Rooftop on 11 is where the full skyline views hit. Floating in the pool and staring out into the open skies is a must, even if it’s just for 20 minutes.
                  - paragraph [ref=f3e1352]:
                    - strong [ref=f3e1353]: "Time Out tip:"
                    - text: Avoid the crowd at Harriet’s Rooftop on weekend nights and take a stroll on the waterfront instead. A ride on Jane’s Carousel is the definition of healing your inner child.
