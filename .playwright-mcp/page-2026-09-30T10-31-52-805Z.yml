                - generic [ref=f3e352]:
                  - paragraph [ref=f3e353]: The William Vale is effortlessly cool. Opened back in 2016, this five-star tower rises 23 floors over Brooklyn’s Williamsburg–Greenpoint border and looks more like something from Tokyo or Seoul than a typical New York hotel. With 183 guestrooms, a rooftop pool, a gym, three restaurants, and incredible skyline views, it feels like an urban resort dropped in the middle of one of the city’s coolest, most walkable neighborhoods.
                  - paragraph [ref=f3e354]: "Rooms here are a world away from Manhattan’s cramped offerings: every single one has a balcony, and higher-end categories throw in extras like hot tubs or private decks. Interiors are crisp and modern, all clean lines and bold architecture that fits right in with the neighborhood. The Vale Pool is a particular standout—not just for its skyline views but also for its barrel saunas and hot tubs. Service is warm and personal, with staff quick to learn names and keep things moving smoothly despite the crowds that Westlight, the rooftop bar, inevitably draws (I mean, look at those views)."
                  - paragraph [ref=f3e355]: Here, you’ve also got loads of brilliant places to eat within walking distance. Everything from Michelin-starred French-Japanese omakase at Restaurant Yuu to Meili, a beautiful, fiery Sichuan restaurant, KRU, which is a creative and classy Thai spot, and Cecily, a cozy dinner place serving eclectic small plates. However, there’s good food to be found within the hotel’s walls, too. Southern Italian restaurant Leuca delivers some of the best pizza and pasta in town, with generous portions and crowd-pleasers like lamb bolognese lumache. Little Fino serves breakfast, pastries, and small plates, while Westlight shakes cocktails and brags spectacular views of Manhattan.
                  - paragraph [ref=f3e356]: The area buzzes with stylish young professionals, boutique shopping, and parks like McCarren and Bushwick Inlet, plus the subway and NYC Ferry are within easy reach. Bikes are available if you want to pedal like a local—which we’d highly recommend doing.
                  - paragraph [ref=f3e357]:
                    - strong [ref=f3e358]: "Time Out tip:"
                    - text: To use these fabulous barrel saunas, you’ll need a Vale Pool reservation—book this at reception when you arrive.
                  - paragraph [ref=f3e359]:
                    - strong [ref=f3e360]: "Address:"
                    - text: 111 N 12th St, Brooklyn, NY
                    - strong [ref=f3e361]: "Price per night:"
                    - text: Queen with Balcony rooms from $385; Vale Garden Residence room from $6,500
                    - strong [ref=f3e362]: "Closest transport:"
                    - text: Nassau Av (G line), Bedford Av (L line), plus NYC Ferry at North Williamsburg, LaGuardia Airport is a 20-minute drive
