                - generic [ref=f3e753]:
                  - paragraph [ref=f3e754]: Times Square may be one of New York’s flashiest, noisiest neighborhoods, but The Knickerbocker proves you can still find peace and five-star luxury in the heart of it all. This landmark hotel—where the dry martini was (rumored to have been) born—delivers understated glamor with soundproofed rooms, minimalist design, and some of the most comfortable beds in the city. Step outside and you’re in the thick of Midtown, yet inside it feels pleasingly calm.
                  - paragraph [ref=f3e755]: "Rooms are spacious, bright, and elegantly neutral, blending warm wood, leather, and stone with soaring ceilings and oversized windows. The real standout, though, is the bed: Euro-top mattresses, Egyptian cotton sheets, and down pillows make for a dreamy night’s sleep–I can’t remember a time when I felt quite so rested. Standard rooms start with Kings and Doubles, and the Martini Suite includes an in-room martini kit—a nod to the hotel’s heritage."
                  - paragraph [ref=f3e756]: Dining options are equally as impressive. Charlie Palmer Steak IV anchors the food scene, from 24-hour room service to hearty breakfasts and the signature Knick Burger. For history with a twist, head to The Martini Lounge for tableside martinis and caviar, or enjoy cocktails and skyline views at St. Cloud Rooftop. Service throughout the hotel is polished yet warm, from early check-in assistance to turndown touches that transform your room into “night mode”.
                  - paragraph [ref=f3e757]: Then there’s the location, which can only really be described as unbeatable. You’re practically a New York minute away from Broadway, Bryant Park and Grand Central, so this is a prime place to stay if you’re visiting New York for the first time.
                  - paragraph [ref=f3e758]:
                    - strong [ref=f3e759]: "Time Out tip:"
                    - text: Even if you’re not typically a martini fan, there’s something ridiculously glamorous about the Martini Service. However, one of Time Out New York’s favorite bars,
                    - link "Nothing Really Matters" [ref=f3e760] [cursor=pointer]:
                      - /url: https://www.timeout.com/newyork/bars/nothing-really-matters
                    - text: ", is a 10 minute stroll down the street."
