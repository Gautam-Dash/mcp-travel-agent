                - generic [ref=f3e1237]:
                  - paragraph [ref=f3e1238]: This hotel is the embodiment of Upper East Side glamor, from the classy confidence other guests exude as they flit through the lobby to the wide black awning which stretches almost the width of Park Avenue. It opened way back in 1963 and, despite recent renovations, still allows drops of its Old New York style to bleed through. Popular with business travelers and shoppers alike, this hotel is perched near the boutiques of Madison and Fifth Avenue, and is just a five minute stroll from Central Park.
                  - paragraph [ref=f3e1239]: By Manhattan standards, the rooms at this hotel are generous, ranging from decently sized 250-square-foot rooms up to massive 1,400-square-foot suites (all of which, by the way, are pet friendly). Oh, and many of them have bathroom-mirror televisions, so you can watch TV in the tub—if that’s your thing. The emphasis here isn’t on super sleek design, but instead on proper, classy high-end comfort, and it delivers.
                  - paragraph [ref=f3e1240]: And downstairs, the same ethos is continued in the Regency Bar & Grill, where you’ll find white-tablecloth dining from breakfast through dinner, with a hearty weekend brunch offering thrown in. The tuna tartare with taro chips is popular, but my personal standout was the veal meatballs and pan-seared branzino. I’d also recommend skipping dessert here and instead heading to the adjoining Sant Ambroeus Coffee Bar, which brags exquisite Italian desserts–go for the marzipan-coated principessa cake.
                  - paragraph [ref=f3e1241]: "Service is what you’d expect from a five-star spot: it will quickly become clear that most other guests are used to this kind of formality, but no matter your request, you’ll be met with efficiency and a cordial but unfailingly professional attitude."
                  - paragraph [ref=f3e1242]: As for the facilities, they include a Julien Farel Restore Salon & Spa, which is a destination in itself for hair, nails, facials, and massages, plus a gym, steam rooms, and saunas. There’s no pool at Loews Regency, but the hotel offers a neat perk—complimentary pickleball paddles and balls for use in nearby Central Park. With eight subway lines nearby, you’re also brilliantly connected to the rest of the city, though the Roosevelt Island Tram offers a unique local adventure.
                  - paragraph [ref=f3e1243]:
                    - strong [ref=f3e1244]: "Time Out tip:"
                    - text: Ask the concierge about their private art tours—the hotel has been known to host small-groups on exclusive looks at The Met’s art collection, led by proper Museum educators, allowing you entry to avoid the crowds.
