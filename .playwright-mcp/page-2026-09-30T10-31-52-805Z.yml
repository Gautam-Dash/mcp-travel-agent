                - generic [ref=f3e1505]:
                  - paragraph [ref=f3e1506]: "This internationally acclaimed business traveler’s paradise has five stars for a reason: the scene, the service and the spa make up the trifecta that sets the 244-room Mandarin Oriental a cut above the rest."
                  - paragraph [ref=f3e1507]: The height of luxury, this chic five-star hotel boasts stunning views, including many rooms with views of Central Park. The elevated experience starts from its 35th-floor lobby decorated with Dale Chihuly glass art. The upscale vibe continues in all the guest rooms, from standard king rooms to its suites. The Hudson River Suite, for example, measures in at 800 square feet, including a spacious living room, a dining/working area, a bedroom, a full bathroom and a powder room.
                  - paragraph [ref=f3e1508]: Inside the 14,500 square-foot Mandarin Oriental Spa, treatments include massages, facials, Thai foot therapy and special treatments. A 75-foot indoor lap pool is on-site for hotel guests who want to get some exercise or for families with kids who want to splash around.
                  - paragraph [ref=f3e1509]: "The little details here and the attention to the guest experience set this hotel apart from the crowd: think binoculars in the guest room, a robotic toilet in the bathroom, luxurious turndown service, and impeccable room service, just to name a few."
                  - paragraph [ref=f3e1510]:
                    - strong [ref=f3e1511]: "Time Out tip:"
                    - text: Oh, and no matter how packed your schedule may be, you’ll definitely want to make time for lunch at MO Lounge, where you’ll revel in panoramic daylight views of the park below. Also at the lounge, you can book afternoon tea service featuring savory sandwiches, scones and a collection of sweets.
