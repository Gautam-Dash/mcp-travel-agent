                  - /url: /newyork/hotels/the-rockaway-hotel
                  - img "The Rockaway Hotel" [ref=f3e1693]
                  - generic [ref=f3e1694]: "Photograph: By Kyle Knodell / Courtesy of The Rockaway Hotel + Spa"
                - generic [ref=f3e1698]:
                  - paragraph [ref=f3e1699]:
                    - generic [ref=f3e1700]:
                      - text: Sometimes you need to escape the city—without
                      - emphasis [ref=f3e1701]: actually
                      - text: leaving the city. The Rockaway Hotel + Spa is the perfect place to do exactly that.
                    - text: An oasis in Queens, the Rockaway Hotel feels like a beachy, remote retreat even though it’s just over an hour’s subway ride from midtown. Decorated in natural blue and tan tones and packed with art, the hotel evokes relaxation along with a sense of New York City cool from the moment you step inside. The luxurious and design-forward 84,000-square-foot hotel offers 53 guest rooms and eight extended-stay residences each with Atlantic Ocean or Jamaica Bay views.
                  - paragraph [ref=f3e1702]: Best of all? It’s just a five-minute walk to the Atlantic Ocean—if you can tear yourself away from the hotel’s on-site pool to make the short walk to the beach, that is. At the hotel’s heated outdoor pool, relax on a lounge chair, drop by the hotel’s cedar saunas and order poolside snacks and drinks from attentive staff. If you’ve got a large group, book a cabana in advance. You can even book a poolside spa service, like the scalp therapy drizzle or the after-sun skin reset.
                  - paragraph [ref=f3e1703]: As for dining, there’s the Pool House with a casual, poolside menu from dawn til dusk. Indoors, you’ll find Margie’s, the ground-floor restaurant that feels like a neighborhood dining room with its menu of American classics. Start with the tuna crispy rice and a citrus salad, then move onto the burger, branzino or a cauliflower steak. Be sure to make time for the Rooftop, where you can enjoy sushi, bao and a raw bar, along with an excellent list of cocktails. The Shark Bite (with ghost pepper tequila) and the EZ Pass (with vodka and lavender) are stand-out classics.
                  - paragraph [ref=f3e1704]:
                    - strong [ref=f3e1705]: "Time Out tip:"
                    - text: The Rockaway Hotel + Spa doesn’t lose its luster when fall comes around. The pool area stays open, transforming into a Winter Pool House with cozy decor, cedar saunas and additional wellness services.
