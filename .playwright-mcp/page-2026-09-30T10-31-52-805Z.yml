                - generic [ref=f3e672]:
                  - paragraph [ref=f3e673]: "If you’re familiar with the original London outpost, you’ll recognize The Ned’s signature blend of decadent design and effortless hosting. In Manhattan, this formula creates a hotel that is as much about socializing as it is about sleeping. It’s located in the vibrant NoMad district, the hotel sits in a “best of both worlds” location: tourist essentials like the Empire State Building and Madison Square Park are within walking distance, while the late-night energy of Downtown is just a short hop away. The Beaux-Arts building serves as a glamorous, creative hub where guests gain coveted access to members-only spaces, including the whimsically muraled Ned’s Club Downstairs."
                  - paragraph [ref=f3e674]: The accommodations range from compact crash pads to warehouse-style studios, all featuring artistic flourishes like vintage writing desks and painter’s screens. In the larger rooms, freestanding baths and walk-in showers come stocked with generous Soho House Cowshed products. While the decor is bold—occasionally featuring intense elements like dark red velvet dividers—the overall feel is one of high-end comfort.
                  - paragraph [ref=f3e675]: Dining is the heart of the experience here. You can enjoy crowd-pleasing Italian at Cecconi’s, upscale grilled dishes in The Dining Room, or a buzzy mezzanine atmosphere at Little Ned.
                  - paragraph [ref=f3e676]:
                    - strong [ref=f3e677]: "Time Out tip:"
                    - text: The hotel truly shines during its “Negroni Hour” (which is actually from 3-5pm) and live music performances in the Atrium.
