                - generic [ref=f3e437]:
                  - paragraph [ref=f3e438]:
                    - text: At the Plaza Hotel, all that glitters is gold. Literally. From chair legs and mirror frames to the bathrooms of each guest room and suite, the details are gilded with 24-carat gold plating. It’s classy and opulent and reminiscent of another time—but then again, it’s the Plaza. The midtown hotel has been a New York icon, offering first-rate lodging since 1907. Throughout the years and after many renovations, the National Historic Landmark’s guest list has been a who’s who of celebs, from the Beatles to Christian Dior, and the backdrop for many cultural works like
                    - emphasis [ref=f3e439]: The Great Gatsby
                    - text: and
                    - emphasis [ref=f3e440]: Eloise at the Plaza
                    - text: .
                  - paragraph [ref=f3e441]: As soon as you enter the main doors, the fresh scent of gardenias whisks you away from the city. A friendly staff member is waiting to greet you in the main lobby under a magnificent crystal chandelier. Take the elevators—with mirrored, gold-columned interior walls—to your floor and discover that even the hallways are decorated impeccably. A velvet bench next to an antique rotary phone and illuminated details within the crown molding paints quite a picture. Inside your chandelier-adorned room, find a bed enveloped in soft white linens, a terry-cloth robe and slippers to match. Then it’s time to unwind.
                  - paragraph [ref=f3e442]: It’s no surprise that the Plaza offers immaculate accommodations, but it strays from its luxury comrades by also offering a flawless complete experience. Packed with culture, history, and a touch of glitz, even if you never left the hotel premises, you would not have missed a drop of the quintessential New York experience.
                  - paragraph [ref=f3e443]:
                    - strong [ref=f3e444]: "Time Out tip:"
                    - text: "Though there is plenty to keep you busy within the Plaza's confines, cross 59th Street to find another New York landmark: Central Park. Explore the grounds, especially the nearby attractions of Wollman Rink for some ice-skating and the Central Park Zoo."
                  - paragraph [ref=f3e445]:
                    - strong [ref=f3e446]: "Address:"
                    - text: 768 Fifth Avenue; New York, NY 10019
                    - strong [ref=f3e447]: "Price per night:"
                    - text: Prices start around $1,300 per night
                    - strong [ref=f3e448]: "Closest transport link:"
                    - text: N/R/W trains are available at the 5th Ave/59th Street Station, just a minute's walk from the hotel
