                - generic [ref=f3e2107]:
                  - paragraph [ref=f3e2108]: Located on the southwest corner of Soho, ModernHaus SoHo is a boutique hotel that blends art and design. Formerly The James New York - Soho, the 114-room property underwent an extensive year-and-a-half renovation in 2020, before reopening with a new name and new look. The result is a work of art, inside and out.
                  - paragraph [ref=f3e2109]: Staying in the Skyline King Studio, the rooms mirror the sophistication of Soho with an edge. Elements of dark wood, concrete and tan leather detail the interior, giving the room a modernist feel. But the crown jewel of the room goes to the views themselves. Two walls of the corner studio feature floor-to-ceiling windows giving sights of Soho and Tribeca, and even a few glimpses of the water if you angle your head right. You can catch these views anywhere in the room, including inside the glass-encased bathroom. You may feel emboldened to survey your kingdom like a king in the nude, but for privacy’s sake, I hit the mechanical shutters and went to the bathroom in peace. The room is entirely insulated from the noise below, for once making the city a quiet place without people and honking cars—just a glorious skyline.
                  - paragraph [ref=f3e2110]: This usage of glass is carried on in the hotel’s restaurant, Twenty Three Grand. The greenhouse-like dining room is entirely encased in glass, with a roof that retracts when the weather is pleasant. Reminiscent of a European bistro, the curved dining room is lined with lush greenery, aquamarine tufted booths and black and white tiled floor. Jazzy tunes from the live band only heightened the romantic space when I visited for dinner.
                  - paragraph [ref=f3e2111]:
                    - strong [ref=f3e2112]: "Time Out tip:"
                    - text: Modernhaus is dog-friendly! So bring your pup and they’ll get a doggie bed and a bowl for water to sip water among the sky.
